services:
  api:
    build:
      dockerfile: server.Dockerfile
    image: quikslate-api
    env_file:
      - .env.api
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8079:8080"
    restart: unless-stopped

  migrate:
    build:
      dockerfile: migrate.Dockerfile
    image: quikslate-migrate
    env_file:
      - .env.migrate
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

    
volumes:
  postgres_data:
