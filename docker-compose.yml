# All values come from .env, which Compose reads automatically. The
# environment: blocks below are the record of which service sees what: migrate
# never receives JWT_SECRET, and the two DATABASE_URLs use different Postgres
# roles so the API cannot create or alter tables.
services:
  api:
    build:
      dockerfile: server.Dockerfile
    image: quikslate-api
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgres://quikslate_api:${API_PASSWORD}@postgres:5432/quikslate?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      SECURE_MODE: ${SECURE_MODE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MAILER: ${MAILER}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      dockerfile: migrate.Dockerfile
    image: quikslate-migrate
    environment:
      DATABASE_URL: postgres://quikslate_migrate:${MIGRATE_PASSWORD}@postgres:5432/quikslate?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: quikslate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Read by initdb/01-roles.sh, on first boot only.
      QUIKSLATE_MIGRATE_PASSWORD: ${MIGRATE_PASSWORD}
      QUIKSLATE_API_PASSWORD: ${API_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
