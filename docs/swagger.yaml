info:
  contact: {}
  description: Scheduling API for businesses, locations, positions, shifts, and employees.
  title: QuikSlate API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password. Returns an access_token and
        sets a refresh_token cookie.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.TokenResponse'
        "400":
          description: invalid body or missing fields
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "401":
          description: invalid credentials
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      description: 'Revoke the current refresh token (if present) and clear the refresh_token
        cookie. Idempotent: always returns 200.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SimpleResponse'
      summary: Logout
      tags:
      - auth
  /auth/refresh:
    post:
      description: Rotate the refresh_token cookie (single use) and issue a new access_token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.TokenResponse'
        "400":
          description: no refresh token cookie
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "401":
          description: invalid or expired refresh token
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
      summary: Refresh
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account. Returns an access_token and sets a refresh_token
        cookie.
      parameters:
      - description: Registration details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.registerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.TokenResponse'
        "400":
          description: invalid body or missing fields
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "409":
          description: email already registered
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
      summary: Register
      tags:
      - auth
  /businesses:
    post:
      consumes:
      - application/json
      description: Create a new business. The caller becomes its primary admin.
      parameters:
      - description: Business details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createBusinessRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.CreateBusinessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
      security:
      - BearerAuth: []
      summary: Create business
      tags:
      - businesses
  /businesses/{businessId}:
    delete:
      description: Delete a business and all of its data (locations, positions, shifts,
        members). Admin only.
      parameters:
      - description: Business ID
        in: path
        name: businessId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SimpleResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
      security:
      - BearerAuth: []
      summary: Delete business
      tags:
      - businesses
    get:
      description: Get a business by ID. Admin only.
      parameters:
      - description: Business ID
        in: path
        name: businessId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.BusinessDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
      security:
      - BearerAuth: []
      summary: Get business
      tags:
      - businesses
    patch:
      consumes:
      - application/json
      description: Rename a business. Admin only.
      parameters:
      - description: Business ID
        in: path
        name: businessId
        required: true
        type: string
      - description: New name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.renameBusinessRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SimpleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
      security:
      - BearerAuth: []
      summary: Rename business
      tags:
      - businesses
  /businesses/{businessId}/employees/{userId}/positions:
    get:
      description: List all positions assigned to a user within the business. Admin,
        Manager, or LocationLead (any location in the business).
      parameters:
      - description: Business ID
        in: path
        name: businessId
        required: true
        type: string
      - description: Target user ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.MultipleEmployeePositionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
      security:
      - BearerAuth: []
      summary: List employee positions
      tags:
      - employees
    post:
      consumes:
      - application/json
      description: Assign a position to a user. Admin, Manager, or LocationLead (any
        location in the business).
      parameters:
      - description: Business ID
        in: path
        name: businessId
        required: true
        type: string
      - description: Target user ID
        in: path
        name: userId
        required: true
        type: string
      - description: Position to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.addPositionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SimpleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
      security:
      - BearerAuth: []
      summary: Add employee position
      tags:
      - employees
  /businesses/{businessId}/employees/{userId}/positions/{positionId}:
    delete:
      description: Remove a position from a user. Admin only.
      parameters:
      - description: Business ID
        in: path
        name: businessId
        required: true
        type: string
      - description: Target user ID
        in: path
        name: userId
        required: true
        type: string
      - description: Position ID
        in: path
        name: positionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SimpleResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
      security:
      - BearerAuth: []
      summary: Remove employee position
      tags:
      - employees
  /businesses/{businessId}/invites/{token}:
    get:
      description: Preview a pending invite by its raw token (email, business name,
        role, expiry). No authentication required.
      parameters:
      - description: Business ID
        in: path
        name: businessId
        required: true
        type: string
      - description: Raw invite token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_service.InviteDTO'
        "404":
          description: invite not found, expired, or already accepted
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
      summary: Preview invite
      tags:
      - invites
  /businesses/{businessId}/invites/{token}/accept:
    post:
      description: Accept a pending invite as the authenticated caller, joining the
        business at the invited location/role.
      parameters:
      - description: Business ID
        in: path
        name: businessId
        required: true
        type: string
      - description: Raw invite token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.AcceptInviteResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "404":
          description: invite not found, expired, or already accepted
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
      security:
      - BearerAuth: []
      summary: Accept invite
      tags:
      - invites
  /businesses/{businessId}/locations:
    get:
      description: List all locations for a business. Business member only.
      parameters:
      - description: Business ID
        in: path
        name: businessId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.MultipleLocationResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
      security:
      - BearerAuth: []
      summary: List locations
      tags:
      - locations
    post:
      consumes:
      - application/json
      description: Create a new location under a business. Admin only.
      parameters:
      - description: Business ID
        in: path
        name: businessId
        required: true
        type: string
      - description: Location details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createLocationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SingleLocationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
      security:
      - BearerAuth: []
      summary: Create location
      tags:
      - locations
  /businesses/{businessId}/locations/{locationId}:
    delete:
      description: Delete a location and its dependent shifts/roles. Admin only.
      parameters:
      - description: Business ID
        in: path
        name: businessId
        required: true
        type: string
      - description: Location ID
        in: path
        name: locationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SimpleResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_dgrco_quikslate_internal_response.errorResponse'
      security:
      - BearerAuth: []
      summary: Delete location
      tags:
      - locations
    get:
      description: Get a single location by ID. Business member only (non-admins restricted
        to their session location).
      parameters:
      - description: Business ID
        in: path
        name: businessId
        required: true
        type: string
      - description: Location ID
        in: path
        name: locationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
