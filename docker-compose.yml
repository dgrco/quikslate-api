services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      # Bound to loopback only. Without the 127.0.0.1 prefix Docker publishes
      # on 0.0.0.0, putting the database on every network this machine is
      # attached to. The API reaches it over localhost, so nothing else needs
      # access — phones and other devices talk to the API, never to Postgres.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
volumes:
  postgres_data:
